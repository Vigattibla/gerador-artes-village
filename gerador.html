<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de Artes – Agentes de Viagem</title>
<script src="fundos.js"></script>
<style>
  @font-face { font-family: Montserrat; font-weight: 500; src: url(fonts/Montserrat-Medium.ttf); }
  @font-face { font-family: Montserrat; font-weight: 600; src: url(fonts/Montserrat-SemiBold.ttf); }
  @font-face { font-family: Montserrat; font-weight: 700; src: url(fonts/Montserrat-Bold.ttf); }
  @font-face { font-family: Montserrat; font-weight: 800; src: url(fonts/Montserrat-ExtraBold.ttf); }
  @font-face { font-family: Montserrat; font-weight: 900; src: url(fonts/Montserrat-Black.ttf); }
  /* mesma Montserrat com dígitos tabulares (tnum) no lugar dos normais: número não muda de largura */
  @font-face { font-family: MontserratTab; font-weight: 700; src: url(fonts/MontserratTab-Bold.ttf); }
  @font-face { font-family: MontserratTab; font-weight: 800; src: url(fonts/MontserratTab-ExtraBold.ttf); }
  :root { --navy: #26324f; --amarelo: #fcc62c; --teal: #74c3b7; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 500 14px Montserrat, sans-serif; background: #f2f2f0; color: var(--navy); }
  header { background: var(--navy); color: #fff; padding: 12px 20px; font-size: 16px; }
  header b { color: var(--amarelo); font-weight: 800; }
  main { display: flex; align-items: flex-start; }
  aside { width: 360px; padding: 16px; height: calc(100vh - 45px); overflow: auto; background: #fff; }
  #modelos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
  #modelos button { border: 2px solid transparent; border-radius: 8px; padding: 4px; background: #f2f2f0;
    font: 600 11px Montserrat; color: var(--navy); cursor: pointer; }
  #modelos button.on { border-color: var(--amarelo); background: #fff7dc; }
  #modelos img { width: 100%; display: block; border-radius: 4px; margin-bottom: 4px; }
  fieldset { border: 0; padding: 0; margin: 0 0 14px; }
  legend { font-weight: 800; text-transform: uppercase; font-size: 12px; margin-bottom: 4px; }
  label { display: block; font-size: 12px; color: #555; margin-bottom: 8px; }
  input, textarea { display: block; width: 100%; margin-top: 2px; padding: 7px 8px; font: 500 14px Montserrat;
    border: 1px solid #ccc; border-radius: 6px; color: #000; }
  input:invalid { border-color: #d33; }
  #palco { flex: 1; min-width: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #palco canvas { width: min(100%, calc((100vh - 130px) * 0.8)); box-shadow: 0 4px 16px #0003; }
  .acoes { display: flex; gap: 8px; }
  .acoes button { font: 700 14px Montserrat; padding: 10px 18px; border-radius: 8px; border: 0; cursor: pointer;
    background: var(--amarelo); color: var(--navy); }
  .acoes button + button { background: var(--navy); color: #fff; }
  @media (max-width: 800px) {
    main { flex-direction: column-reverse; }
    aside { width: 100%; height: auto; }
    #palco canvas { width: 100%; }
  }
  body.only { background: none; }
  body.only img { width: 1080px; display: block; }
</style>
</head>
<body>
<header><b>Village Resort</b> · Gerador de artes para agentes</header>
<main>
  <aside>
    <div id="modelos"></div>
    <form id="form"></form>
  </aside>
  <section id="palco">
    <canvas id="arte" width="2160" height="2700"></canvas>
    <div class="acoes">
      <button id="baixar" type="button">Baixar PNG</button>
      <button id="copiar" type="button">Copiar imagem</button>
    </div>
  </section>
</main>
<script>
// Coordenadas em pt da prancheta do .ai (1080x1350). Canvas renderiza em 2x.
const S = 2;
const NAVY = '#26324f', TEAL = '#74c3b7', YELLOW = '#fcc62c', WHITE = '#fff', BLACK = '#000';

const CAMPOS = { // chave: [rótulo, padrão, tipo]
  a_rotulo: ['Rótulo', 'Páscoa'],
  a_preco: ['Preço por dia (casal)', '416,57', 'preco'],
  a_ida: ['Ida', '2026-04-01', 'date'],
  a_volta: ['Volta', '2026-04-01', 'date'],
  b_rotulo: ['Rótulo', 'Natal'],
  b_preco: ['Preço por dia (casal)', '516,57', 'preco'],
  b_ida: ['Ida', '2026-04-03', 'date'],
  b_volta: ['Volta', '2026-04-05', 'date'],
  parcelas: ['Parcelas', '7x de'],
  local: ['Local', 'Village Resort - Jaboticatubas, MG'],
  telefone: ['Telefone', '(31) 97263-1696'],
  site: ['Site', 'PRECISAALTERAR.COM.BR'],
  selo: ['Selo', 'TUDO INCLUSO & LAZER'],
  chamada: ['Chamada (*negrito*)', 'Duas formas de curtir, a mesma\nexcursão inesquecível.* QUAL É A SUA?*', 'area'],
  titulo1: ['Título linha 1', 'Tudo Incluso'],
  titulo2: ['Título linha 2', '+ Lazer'],
  descricao: ['Descrição', 'Hospedagem com refeições, bebidas e recreação', 'area'],
  item1: ['Item 1', 'Acomodação em apartamentos'],
  item2: ['Item 2', 'Gastronomia no Village Experience'],
  item3: ['Item 3', 'Cafeteria no local'],
  item4: ['Item 4', 'Equipe de Recreação'],
  aviso: ['Aviso legal', 'Valores para o casal por dia em acomodação tipo apartamento. Chalés não estão inclusos nas condições deste pacote. Válido para grupos de no mínimo 24 pessoas. Sujeito a alterações sem aviso prévio.', 'area'],
};
const GRUPOS = [
  ['Pacote 1', ['a_rotulo', 'a_preco', 'a_ida', 'a_volta']],
  ['Pacote 2', ['b_rotulo', 'b_preco', 'b_ida', 'b_volta']],
  ['Oferta', ['parcelas', 'local']],
  ['Contato', ['telefone', 'site']],
  ['Textos', ['selo', 'chamada', 'titulo1', 'titulo2', 'descricao', 'item1', 'item2', 'item3', 'item4', 'aviso']],
];

// ---------- desenho ----------
const F = (w, s, fam = 'Montserrat') => `${w} ${s}px ${fam}`;
const TAB = 'MontserratTab';
const data = d => d.split('-').reverse().join('/');

// texto simples; maxW encolhe a fonte pra caber; align 'center' usa x como centro
function T(c, s, x, y, w, size, color, { ls = 0, maxW = 0, align = 'left', fam } = {}) {
  c.font = F(w, size, fam); c.letterSpacing = ls + 'px';
  const m = c.measureText(s).width;
  if (maxW && m > maxW) { const k = maxW / m; c.font = F(w, size * k, fam); c.letterSpacing = ls * k + 'px'; }
  c.fillStyle = color; c.textAlign = align;
  c.fillText(s, x, y);
  c.textAlign = 'left';
}

// quebra por largura (respeita \n) e desenha com entrelinha lh
function P(c, s, x, y, w, size, color, lh, maxW, ls = 0) {
  c.font = F(w, size); c.letterSpacing = ls + 'px'; c.fillStyle = color;
  const lines = [];
  for (const par of s.split('\n')) {
    let line = '';
    for (const word of par.split(' ')) {
      const t = line ? line + ' ' + word : word;
      if (line && c.measureText(t).width > maxW) { lines.push(line); line = word; } else line = t;
    }
    lines.push(line);
  }
  lines.forEach((l, i) => c.fillText(l, x, y + i * lh));
}

// preço do card; (x, y) = origem/baseline do número grande
function preco(c, x, y, v, p) {
  const [int, cents = '00'] = v[p + 'preco'].replace('.', ',').split(',');
  c.save(); c.translate(x - 1.5, y - 114.9); c.scale(1, 1.052); // escala vertical 105% no .ai
  T(c, 'A partir de', 0, 0, 700, 34.93, TEAL);
  c.restore();
  T(c, 'para o casal', x + 250.6, y - 76.5, 500, 12.88, WHITE);
  T(c, 'por dia', x + 250.6, y - 56.5, 900, 20.51, WHITE);
  // dígitos tabulares são mais largos que o "416" do .ai: tracking -30/1000 e escala fixa
  // pra "000,00" ocupar os mesmos 326pt do original (tamanho igual pra qualquer número)
  const LS = -3.98;
  c.font = F(800, 132.67, TAB); c.letterSpacing = LS + 'px';
  const wi = c.measureText(int).width, w000 = c.measureText('000').width;
  c.font = F(800, 57.42, TAB); c.letterSpacing = '0px';
  const k = 326 / (w000 + 1.7 + c.measureText(',00').width);
  T(c, int, x + 0.5, y, 800, 132.67 * k, WHITE, { ls: LS * k, fam: TAB });
  T(c, ',' + cents, x + (wi + 1.7) * k, y, 800, 57.42 * k, WHITE, { fam: TAB });
  // "7x de" com contorno azul empilhado (sombra de 4pt), igual ao .ai
  c.font = F(900, 34.74); c.letterSpacing = '0px';
  c.lineJoin = 'round'; c.lineWidth = 9; c.strokeStyle = NAVY;
  for (const dy of [4, 2, 0]) c.strokeText(v.parcelas, x + 78.6, y - 32.9 + dy);
  c.fillStyle = YELLOW; c.fillText(v.parcelas, x + 78.6, y - 32.9);
}

function card(c, x, y, v, p) {
  preco(c, x, y, v, p);
  // tabular sem tracking = mesma largura do original com tracking 75
  T(c, data(v[p + 'ida']), x + 32.3, y + 52.8, 700, 18.73, NAVY, { fam: TAB });
  T(c, data(v[p + 'volta']), x + 206.1, y + 52.8, 700, 18.73, NAVY, { fam: TAB });
  T(c, v.local, x + 32.8, y + 110.2, 500, 14.66, WHITE, { ls: 1.1, maxW: 320 });
}

function rodape(c, v, dx, dy) {
  T(c, v.telefone, 283.3 + dx, 1080.5 + dy, 700, 22.86, NAVY, { maxW: 185 });
  T(c, v.site, 146.3 + dx, 1154.1 + dy, 700, 20, WHITE, { ls: 1.1, maxW: 320 });
}

const MODELOS = [
  {
    nome: '1 pacote',
    campos: ['a_preco', 'a_ida', 'a_volta', 'parcelas', 'local', 'telefone', 'site',
      'titulo1', 'titulo2', 'descricao', 'item1', 'item2', 'item3', 'item4', 'aviso'],
    draw(c, v) {
      card(c, 114.3, 461.8, v, 'a_');
      T(c, v.titulo1, 104.9, 686.9, 900, 35.19, NAVY, { maxW: 270 });
      T(c, v.titulo2, 104.9, 725.9, 900, 43, NAVY, { maxW: 270 });
      P(c, v.descricao, 104.9, 766.2, 500, 17, BLACK, 20.4, 300, 1.28);
      P(c, v.item1, 145.2, 833.3, 600, 18, BLACK, 21.6, 300);
      P(c, v.item2, 145.2, 876.5, 600, 18, BLACK, 21.6, 300);
      P(c, v.item3, 145.2, 941.3, 600, 18, BLACK, 21.6, 300);
      P(c, v.item4, 145.2, 984.5, 600, 18, BLACK, 21.6, 300);
      rodape(c, v, 0, 0);
      P(c, v.aviso, 80.1, 1213.7, 500, 13, BLACK, 15.6, 560);
    },
  },
  {
    nome: '2 pacotes',
    campos: ['a_preco', 'a_ida', 'a_volta', 'b_preco', 'b_ida', 'b_volta', 'parcelas', 'local',
      'telefone', 'site', 'selo', 'aviso'],
    draw(c, v) {
      T(c, v.selo, 80.6, 122.7, 800, 23.31, NAVY, { maxW: 310 });
      T(c, 'EXCURSÃO ALL', 72.9, 200.6, 900, 47.19, WHITE);   // fixo: contorno está no fundo
      T(c, 'FUN INCLUSIVE', 72.9, 248.9, 900, 47.19, TEAL);
      card(c, 109.2, 490.9, v, 'a_');
      card(c, 109.2, 845.3, v, 'b_');
      rodape(c, v, -5.1, -20.2);
      P(c, v.aviso, 72.9, 1193.6, 500, 13, BLACK, 15.6, 428);
    },
  },
  {
    nome: 'Comparativo',
    campos: ['a_rotulo', 'a_preco', 'b_rotulo', 'b_preco', 'parcelas', 'chamada'],
    draw(c, v) {
      v.chamada.split('\n').forEach((line, i) => {
        const runs = line.split('*').map((t, j) => [t, j % 2 ? 800 : 600]);
        c.letterSpacing = '0px';
        const w = runs.reduce((sum, [t, wt]) => (c.font = F(wt, 42), sum + c.measureText(t).width), 0);
        let x = 531.2 - w / 2;
        for (const [t, wt] of runs) { T(c, t, x, 186.5 + i * 50.4, wt, 42, BLACK); c.font = F(wt, 42); x += c.measureText(t).width; }
      });
      T(c, v.a_rotulo, 288.0, 384.7, 800, 38.4, WHITE, { maxW: 155, align: 'center' });
      T(c, v.b_rotulo, 789.8, 384.7, 800, 38.4, WHITE, { maxW: 155, align: 'center' });
      preco(c, 120.8, 950.4, v, 'a_');
      preco(c, 621.2, 950.4, v, 'b_');
    },
  },
];

// ---------- UI ----------
const q = new URLSearchParams(location.search);
const only = q.has('only'); // modo headless: ?only&layout=1&a_preco=... -> só a arte, 1080px
let salvo = {};
try { if (!only) salvo = JSON.parse(localStorage.gerador || '{}'); } catch {}

const form = document.getElementById('form');
const cv = document.getElementById('arte');
const fundos = FUNDOS.map(src => Object.assign(new Image(), { src }));
let atual = 0;

for (const [grupo, keys] of GRUPOS) {
  const fs = form.appendChild(document.createElement('fieldset'));
  fs.append(Object.assign(document.createElement('legend'), { textContent: grupo }));
  for (const key of keys) {
    const [rotulo, def, tipo] = CAMPOS[key];
    const lb = fs.appendChild(document.createElement('label'));
    lb.dataset.key = key;
    lb.append(rotulo);
    const el = lb.appendChild(document.createElement(tipo === 'area' ? 'textarea' : 'input'));
    if (tipo === 'date') el.type = 'date';
    if (tipo === 'area') el.rows = 3;
    if (tipo === 'preco') Object.assign(el, { inputMode: 'decimal', pattern: '\\d{1,3}([,.]\\d{2})?', placeholder: '416,57' });
    el.name = key;
    el.value = q.get(key) ?? salvo[key] ?? def;
  }
}

MODELOS.forEach((m, i) => {
  const bt = document.createElement('button');
  bt.type = 'button';
  bt.append(Object.assign(new Image(), { src: FUNDOS[i] }), m.nome);
  bt.onclick = () => selecionar(i);
  document.getElementById('modelos').append(bt);
});

function selecionar(i) {
  atual = i;
  document.querySelectorAll('#modelos button').forEach((b, j) => b.classList.toggle('on', j === i));
  for (const lb of form.querySelectorAll('label')) lb.hidden = !MODELOS[i].campos.includes(lb.dataset.key);
  for (const fs of form.querySelectorAll('fieldset')) fs.hidden = !fs.querySelector('label:not([hidden])');
  render();
}

function render() {
  const v = Object.fromEntries(new FormData(form));
  const c = cv.getContext('2d');
  c.setTransform(S, 0, 0, S, 0, 0);
  c.drawImage(fundos[atual], 0, 0, 1080, 1350);
  MODELOS[atual].draw(c, v);
  // canvas grande não sai no screenshot headless; entrega como <img>
  if (only) return document.body.replaceChildren(Object.assign(new Image(), { src: cv.toDataURL() }));
  try { localStorage.gerador = JSON.stringify({ ...v, modelo: atual }); } catch {}
}

document.getElementById('baixar').onclick = () => cv.toBlob(b => Object.assign(document.createElement('a'),
  { href: URL.createObjectURL(b), download: `village-arte${atual + 1}.png` }).click());

const copiar = document.getElementById('copiar');
copiar.onclick = async () => {
  try {
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': new Promise(ok => cv.toBlob(ok)) })]);
    copiar.textContent = 'Copiado!';
  } catch { copiar.textContent = 'Não deu pra copiar'; }
  setTimeout(() => copiar.textContent = 'Copiar imagem', 1500);
};

if (only) document.body.classList.add('only');
form.oninput = render;
Promise.all([
  ...fundos.map(img => img.complete || new Promise(ok => img.onload = ok)), // decode() trava no Chrome headless
  ...[500, 600, 700, 800, 900].map(w => document.fonts.load(F(w, 20))),
  ...[700, 800].map(w => document.fonts.load(F(w, 20, TAB)))
]).then(() => selecionar(q.has('layout') ? q.get('layout') - 1 : salvo.modelo ?? 0));
</script>
</body>
</html>
